version: "3"

vars:
  PROJECT_NAME:
    sh: >-
      powershell -NoProfile -Command
      "(Select-String -Path '.env' -Pattern '^PROJECT_NAME\\s*=' | Select-Object -First 1).Line.Split('=', 2)[1].Trim()"
  PROJECT_VERSION:
    sh: >-
      powershell -NoProfile -Command
      "(Select-String -Path '.env' -Pattern '^PROJECT_VERSION\\s*=' | Select-Object -First 1).Line.Split('=', 2)[1].Trim()"
  PORT:
    sh: >-
      powershell -NoProfile -Command
      "(Select-String -Path '.env' -Pattern '^PORT\\s*=' | Select-Object -First 1).Line.Split('=', 2)[1].Trim()"
  EXE:
    sh: >-
      powershell -NoProfile -Command
      "(Select-String -Path '.env' -Pattern '^EXE\\s*=' | Select-Object -First 1).Line.Split('=', 2)[1].Trim()"
  BIN_NAME: "{{.PROJECT_NAME}}{{.EXE}}"
  BIN_PATH: "./bin/{{.BIN_NAME}}"
  PROJECT_NAME_LOW:
    sh: >-
      powershell -NoProfile -Command
      "'{{.PROJECT_NAME}}'.ToLowerInvariant()"
  COMPOSE_DEV: "deploy/docker-compose.dev.yml"
  COMPOSE_PROD: "deploy/docker-compose.prod.yml"

tasks:
  default:
    desc: "show available tasks"
    cmds:
      - task --list

  swagger:
    desc: "generate swagger documentation"
    cmds:
      - swag init -g internal/app/app.go --exclude vendor --exclude ./

  build:
    desc: "build the application binary"
    deps: ["swagger"]
    cmds:
      - go build -trimpath -o {{.BIN_PATH}} ./cmd

  run:
    desc: "build and run the application"
    deps: ["build"]
    cmds:
      - "{{.BIN_PATH}}"

  run:debug:
    desc: "build and run the application with debug flags"
    deps: ["swagger"]
    cmds:
      - go build -gcflags=all=-N -gcflags=all=-l -o {{.BIN_PATH}} ./cmd
      - "{{.BIN_PATH}}"

  test:
    desc: "run tests"
    cmds:
      - go test ./...

  lint:
    desc: "run linter"
    cmds:
      - golangci-lint run

  version:bump:patch:
    desc: "increment PROJECT_VERSION patch in .env"
    cmds:
      - >-
        powershell -NoProfile -Command
        "$p='PROJECT_VERSION=([0-9]+)\.([0-9]+)\.([0-9]+)';
        $content=Get-Content '.env';
        $updated=$content | ForEach-Object {
          if ($_ -match $p) {
            'PROJECT_VERSION=' + $matches[1] + '.' + $matches[2] + '.' + ([int]$matches[3] + 1)
          } else {
            $_
          }
        };
        Set-Content '.env' $updated"

  docker:build:
    desc: "build robin and clickhouse images with docker compose"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} build --no-cache robin clickhouse

  docker:up:
    desc: "start dev docker stack"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up -d

  docker:rebuild:
    desc: "rebuild and restart dev docker stack"
    deps: ["docker:build"]
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up -d

  docker:down:
    desc: "stop dev docker stack"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} down

  docker:ps:
    desc: "show dev docker stack status"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} ps

  docker:logs:
    desc: "show dev docker stack logs"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} logs -f

  docker:clean:
    desc: "stop dev/prod stacks and remove local images"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} down --remove-orphans
      - docker compose -f {{.COMPOSE_PROD}} down --remove-orphans
      - powershell -NoProfile -Command "if (docker image inspect '{{.PROJECT_NAME_LOW}}-clickhouse' *> $null) { docker rmi '{{.PROJECT_NAME_LOW}}-clickhouse' }"
      - powershell -NoProfile -Command "if (docker image inspect '{{.PROJECT_NAME_LOW}}-robin' *> $null) { docker rmi '{{.PROJECT_NAME_LOW}}-robin' }"

  docker:prod:up:
    desc: "start prod docker stack"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} up -d

  docker:prod:down:
    desc: "stop prod docker stack"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} down
