version: "3"

vars:
  ENV_FILE:
    sh: test -f .env && printf '%s\n' .env || printf '%s\n' .env.example
  PROJECT_NAME:
    sh: >-
      awk -F= -v key='PROJECT_NAME'
      '$0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
        value=$0;
        sub("^[[:space:]]*" key "[[:space:]]*=[[:space:]]*", "", value);
        sub(/[[:space:]]*$/, "", value);
        print value;
        found=1;
        exit
      }
      END { if (!found) exit 1 }'
      {{.ENV_FILE}}
  PROJECT_VERSION:
    sh: >-
      awk -F= -v key='PROJECT_VERSION'
      '$0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
        value=$0;
        sub("^[[:space:]]*" key "[[:space:]]*=[[:space:]]*", "", value);
        sub(/[[:space:]]*$/, "", value);
        print value;
        found=1;
        exit
      }
      END { if (!found) exit 1 }'
      {{.ENV_FILE}}
  PORT:
    sh: >-
      awk -F= -v key='PORT'
      '$0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
        value=$0;
        sub("^[[:space:]]*" key "[[:space:]]*=[[:space:]]*", "", value);
        sub(/[[:space:]]*$/, "", value);
        print value;
        found=1;
        exit
      }
      END { if (!found) exit 1 }'
      {{.ENV_FILE}}
  EXE:
    sh: >-
      awk -F= -v key='EXE'
      '$0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
        value=$0;
        sub("^[[:space:]]*" key "[[:space:]]*=[[:space:]]*", "", value);
        sub(/[[:space:]]*$/, "", value);
        print value;
        found=1;
        exit
      }
      END { if (!found) exit 1 }'
      {{.ENV_FILE}}
  BIN_NAME: "{{.PROJECT_NAME}}{{.EXE}}"
  BIN_PATH: "./bin/{{.BIN_NAME}}"
  PROJECT_NAME_LOW:
    sh: printf '%s' '{{.PROJECT_NAME}}' | tr '[:upper:]' '[:lower:]'
  COMPOSE_DEV: "deploy/docker-compose.dev.yml"
  COMPOSE_PROD: "deploy/docker-compose.prod.yml"

tasks:
  default:
    desc: "show available tasks"
    cmds:
      - task --list

  swagger:
    desc: "generate swagger documentation"
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g app.go -d internal/app --parseInternal

  build:
    desc: "build the application binary"
    deps: ["swagger"]
    cmds:
      - go build -trimpath -o {{.BIN_PATH}} ./cmd

  run:
    desc: "build and run the application"
    deps: ["build"]
    cmds:
      - "{{.BIN_PATH}}"

  run:debug:
    desc: "build and run the application with debug flags"
    deps: ["swagger"]
    cmds:
      - go build -gcflags=all=-N -gcflags=all=-l -o {{.BIN_PATH}} ./cmd
      - "{{.BIN_PATH}}"

  test:
    desc: "run tests"
    cmds:
      - go test ./...

  lint:
    desc: "run linter"
    cmds:
      - golangci-lint run

  version:bump:patch:
    desc: "increment PROJECT_VERSION patch in .env"
    cmds:
      - >-
        test -f .env ||
        { echo ".env not found; copy .env.example to .env first" >&2; exit 1; };
        tmp="$(mktemp)";
        awk '
          BEGIN { updated=0 }
          /^[[:space:]]*PROJECT_VERSION[[:space:]]*=/ {
            value=$0;
            sub(/^[[:space:]]*PROJECT_VERSION[[:space:]]*=[[:space:]]*/, "", value);
            sub(/[[:space:]]*$/, "", value);
            split(value, parts, ".");
            if (parts[1] ~ /^[0-9]+$/ && parts[2] ~ /^[0-9]+$/ && parts[3] ~ /^[0-9]+$/) {
              print "PROJECT_VERSION=" parts[1] "." parts[2] "." (parts[3] + 1);
              updated=1;
              next;
            }
          }
          { print }
          END { if (!updated) exit 1 }
        ' .env > "$tmp" &&
        mv "$tmp" .env ||
        { rc=$?; rm -f "$tmp"; exit "$rc"; }

  docker:build:
    desc: "build robin image with docker compose cache"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} build robin

  docker:build:all:
    desc: "build robin and clickhouse images with docker compose cache"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} build robin clickhouse

  docker:build:clean:
    desc: "rebuild robin and clickhouse images without docker cache"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} build --no-cache robin clickhouse

  docker:up:
    desc: "start dev docker stack"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up -d

  docker:rebuild:
    desc: "rebuild robin image and restart dev docker stack"
    deps: ["docker:build"]
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up -d

  docker:rebuild:all:
    desc: "rebuild robin and clickhouse images and restart dev docker stack"
    deps: ["docker:build:all"]
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} up -d

  docker:down:
    desc: "stop dev docker stack"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} down

  docker:ps:
    desc: "show dev docker stack status"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} ps

  docker:logs:
    desc: "show dev docker stack logs"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} logs -f

  docker:clean:
    desc: "stop dev/prod stacks and remove local images"
    cmds:
      - docker compose -f {{.COMPOSE_DEV}} down --remove-orphans
      - docker compose -f {{.COMPOSE_PROD}} down --remove-orphans
      - docker image inspect '{{.PROJECT_NAME_LOW}}-clickhouse' >/dev/null 2>&1 && docker rmi '{{.PROJECT_NAME_LOW}}-clickhouse' || true
      - docker image inspect '{{.PROJECT_NAME_LOW}}-robin' >/dev/null 2>&1 && docker rmi '{{.PROJECT_NAME_LOW}}-robin' || true

  docker:prod:up:
    desc: "start prod docker stack"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} up -d

  docker:prod:down:
    desc: "stop prod docker stack"
    env:
      PROJECT_NAME: "{{.PROJECT_NAME}}"
      PROJECT_VERSION: "{{.PROJECT_VERSION}}"
      PORT: "{{.PORT}}"
    cmds:
      - docker compose -f {{.COMPOSE_PROD}} down
