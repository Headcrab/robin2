version: "3"

dotenv: [".env"]

vars:
  NEW_VERSION:
    sh: echo {{.PROJECT_VERSION}} | awk -F. -v OFS=. '{$3++; print $1, $2, $3}'
  PROJECT_NAME_LOW:
    sh: echo {{.PROJECT_NAME}} | tr A-Z a-z

tasks:
  # Build tasks
  swagger:
    desc: "generate swagger documentation"
    cmds:
      - swag init -g internal/app/app.go --exclude vendor --exclude ./

  build:
    desc: "build the application binary"
    deps: ["update_version", "swagger"]
    cmds:
      - echo "Building project {{.PROJECT_NAME}} version {{.NEW_VERSION}}..."
      - CGO_ENABLED=0 go build -ldflags "-s -w -X main.Name={{.PROJECT_NAME}} -X main.AppVersion={{.NEW_VERSION}}" -trimpath -o ./bin/robin{{.EXE}} {{.PROJECT_PATH}}
      - echo "Build completed successfully."

  # Run tasks
  run:
    desc: "run the application"
    deps: ["build"]
    dir: "."
    cmds:
      - ./bin/robin{{.EXE}}

  run:debug:
    desc: "run the application with debug flags"
    deps: ["swagger"]
    dir: "."
    cmds:
      - go build -gcflags="all=-N -l" -o ./bin/robin{{.EXE}} {{.PROJECT_PATH}}
      - ./bin/robin{{.EXE}}

  # Docker tasks
  docker:build:
    desc: "build main application docker image"
    deps: ["update_version"]
    cmds:
      - docker build --build-arg PROJECT_NAME={{.PROJECT_NAME}} --build-arg PROJECT_VERSION={{.NEW_VERSION}} --build-arg PORT={{.PORT}} -f deploy/robin/Dockerfile -t {{.PROJECT_NAME_LOW}} .

  docker:build:clickhouse:
    desc: "build clickhouse docker image"
    cmds:
      - docker build -f deploy/clickhouse/Dockerfile -t {{.PROJECT_NAME_LOW}}-clickhouse deploy/clickhouse

  docker:run:
    desc: "run docker containers"
    deps: ["docker:build", "docker:build:clickhouse"]
    cmds:
      - PROJECT_NAME={{.PROJECT_NAME}} PROJECT_VERSION={{.NEW_VERSION}} PORT={{.PORT}} docker-compose -f ./deploy/docker-compose.dev.yml up -d

  docker:stop:
    desc: "stop and clean docker containers"
    cmds:
      - docker-compose -f ./deploy/docker-compose.dev.yml down || true
      - docker-compose -f ./deploy/docker-compose.prod.yml down || true
      - |
        if docker images {{.PROJECT_NAME_LOW}}-clickhouse -q; then
          docker rmi {{.PROJECT_NAME_LOW}}-clickhouse
        fi
      - |
        if docker images {{.PROJECT_NAME_LOW}} -q; then
          docker rmi {{.PROJECT_NAME_LOW}}
        fi

  docker:logs:
    desc: "show docker container logs"
    cmds:
      - docker-compose -f ./deploy/docker-compose.dev.yml logs -f

  # Test and quality tasks
  test:
    desc: "run tests"
    cmds:
      - go test ./...

  lint:
    desc: "run linter"
    cmds:
      - golangci-lint run

  # Utility tasks
  update_version:
    internal: true
    cmds:
      - sed -i -E "s/PROJECT_VERSION.*/PROJECT_VERSION={{.NEW_VERSION}}/" .env
