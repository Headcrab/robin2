<div style="display:flex; align-items:center; justify-content:space-between; width:100%; height:100%;">

  <!-- Left: title + breadcrumb -->
  <div style="display:flex; align-items:center; gap:16px;">
    <h1 style="font-size:17px; font-weight:700; color:var(--text-primary); letter-spacing:-0.3px; margin:0;"
      id="page-title" data-i18n="home.title">
      Система получения данных АСУТП
    </h1>
    <nav class="hidden sm:flex" aria-label="Хлебные крошки" style="display:none;">
      <ol
        style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); list-style:none; margin:0; padding:0;">
        <li id="breadcrumb-container"></li>
      </ol>
    </nav>
  </div>

  <!-- Right: actions -->
  <div style="display:flex; align-items:center; gap:8px;">

    <!-- Refresh -->
    <button id="refresh-btn" class="header-icon-btn" data-i18n-title="common.refresh" aria-label="Обновить данные"
      title="Обновить данные">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    </button>

    <!-- Status -->
    <div class="status-pill">
      <div id="header-status" class="status-dot unknown"></div>
      <span class="hidden sm:inline" data-i18n="common.system" style="font-size:12px;">Система</span>
    </div>

    <!-- Theme/Language switchers (injected by JS) -->
    <div id="theme-language-switchers-placeholder" style="display:flex; align-items:center; gap:6px;"></div>
  </div>

</div>
