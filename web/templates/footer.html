<div style="padding:12px 24px;">
  <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;">

    <!-- DB info -->
    <div style="display:flex; flex-wrap:wrap; gap:16px; align-items:center;">
      <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
        <span
          style="font-weight:600; color:var(--text-muted); text-transform:uppercase; font-size:10px; letter-spacing:0.5px;">БД</span>
        <span id="dbtype" style="color:var(--text-secondary); font-weight:500;">—</span>
        <span id="dbversion" style="color:var(--text-muted);">—</span>
      </div>
      <div style="width:1px; height:14px; background:var(--border);"></div>
      <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
        <span
          style="font-weight:600; color:var(--text-muted); text-transform:uppercase; font-size:10px; letter-spacing:0.5px;">Сервер</span>
        <span id="dbserver"
          style="color:var(--text-secondary); font-family:var(--font-mono,monospace); font-size:11px;">—</span>
      </div>
    </div>

    <!-- Uptime info -->
    <div style="display:flex; flex-wrap:wrap; gap:16px; align-items:center;">
      <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
        <span
          style="font-weight:600; color:var(--text-muted); text-transform:uppercase; font-size:10px; letter-spacing:0.5px;">Uptime
          БД</span>
        <span id="dbuptime"
          style="color:var(--text-secondary); font-family:var(--font-mono,monospace); font-size:11px;">—</span>
      </div>
      <div style="width:1px; height:14px; background:var(--border);"></div>
      <div style="display:flex; align-items:center; gap:6px; font-size:12px;">
        <span
          style="font-weight:600; color:var(--text-muted); text-transform:uppercase; font-size:10px; letter-spacing:0.5px;">Приложение</span>
        <span id="appuptime"
          style="color:var(--text-secondary); font-family:var(--font-mono,monospace); font-size:11px;">—</span>
      </div>
    </div>

    <!-- Copyright + last update -->
    <div style="display:flex; align-items:center; gap:10px; font-size:11px; color:var(--text-muted);">
      <span>© 2024 Robin АСУТП</span>
      <span style="color:var(--border);">•</span>
      <span>Обновлено: <span id="last-update" style="font-family:var(--font-mono,monospace);">—</span></span>
    </div>

  </div>
</div>
