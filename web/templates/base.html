<!doctype html>
<html lang="ru" class="h-full">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Система получения данных АСУТП — современный веб-интерфейс для мониторинга и управления данными" />
  <meta name="theme-color" content="#0f6cbd" />
  <title>Robin АСУТП</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/icon.png" />

  <link rel="stylesheet" href="/css/tailwind.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/dark-theme.css" />

  <script type="module" src="/scripts/script.js"></script>
</head>

<body class="app-body">
  <div id="loader">
    <div class="loader-shell">
      <div class="loader-spinner"></div>
      <p class="loader-label">Загрузка...</p>
    </div>
  </div>

  <div id="apiserver" class="sr-only">{{.app.apiserver}}</div>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      {{ template "navigation.html" . }}
    </aside>

    <div id="mobile-menu-overlay" aria-hidden="true"></div>
    <nav id="mobile-nav" aria-label="Мобильная навигация">
      <div class="mobile-nav-header">
        <div class="mobile-nav-brand">
          <div class="mobile-nav-brand-icon" aria-hidden="true">
            <span class="brand-mark">R</span>
          </div>
          <div>
            <div class="mobile-nav-brand-title">Robin АСУТП</div>
            <div class="mobile-nav-brand-sub">Data System</div>
          </div>
        </div>
        <button id="mobile-menu-close" class="mobile-nav-close" aria-label="Закрыть меню">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="mobile-nav-links">
        <a href="#" onclick="loadPage('/'); closeMobileMenu(); return false;" class="nav-link-item">
          <span class="nav-link-icon"><img src="/images/Home_80px.png" alt="" /></span>
          <span data-i18n="nav.home">Главная</span>
        </a>
        <a href="#" onclick="loadPage('/data/'); closeMobileMenu(); return false;" class="nav-link-item">
          <span class="nav-link-icon"><img src="/images/Data Sheet_80px.png" alt="" /></span>
          <span data-i18n="nav.data">Данные</span>
        </a>
        <a href="#" onclick="loadPage('/charts/'); closeMobileMenu(); return false;" class="nav-link-item">
          <span class="nav-link-icon"><img src="/images/Data Sheet_96px.png" alt="" /></span>
          <span data-i18n="nav.charts">Графики</span>
        </a>
        <a href="#" onclick="loadPage('/tags/'); closeMobileMenu(); return false;" class="nav-link-item">
          <span class="nav-link-icon"><img src="/images/Report Card_80px.png" alt="" /></span>
          <span data-i18n="nav.tags">Теги</span>
        </a>
        <a href="#" onclick="loadPage('/logs/'); closeMobileMenu(); return false;" class="nav-link-item">
          <span class="nav-link-icon"><img src="/images/Choice_80px.png" alt="" /></span>
          <span data-i18n="nav.logs">Логи</span>
        </a>
        <a href="#" onclick="loadPage('/docs/'); closeMobileMenu(); return false;" class="nav-link-item">
          <span class="nav-link-icon"><img src="/images/Knowledge_80px.png" alt="" /></span>
          <span data-i18n="nav.docs">Документация</span>
        </a>
        <a href="#" onclick="loadPage('/swagger/'); closeMobileMenu(); return false;" class="nav-link-item">
          <span class="nav-link-icon"><img src="/images/API_80px.png" alt="" /></span>
          <span data-i18n="nav.api">API</span>
        </a>
      </div>

      <div class="mobile-nav-status">
        <div class="sidebar-status-row">
          <div id="mobile-dbstatus" class="status-dot unknown"></div>
          <span id="mobile-dbstatus-text">Проверка...</span>
        </div>
      </div>
    </nav>

    <div class="main-wrapper">
      <header id="main-header" class="app-header">
        {{ template "header.html" . }}
      </header>

      <main>
        <div class="page-container">
          {{.content}}
        </div>
      </main>

      <footer class="app-footer">
        {{ template "footer.html" . }}
      </footer>
    </div>
  </div>

  <button id="mobile-menu-toggle" aria-label="Открыть меню">
    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
</body>

</html>
